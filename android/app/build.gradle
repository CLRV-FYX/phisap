plugins {
    id "com.android.application"
}

android {
    namespace "app.phisap.pocket"
    compileSdk 34

    sourceSets {
        main {
            assets.srcDir("$buildDir/generated/phisap-assets")
            jniLibs.srcDir("$buildDir/generated/phisap-jniLibs")
        }
    }

    defaultConfig {
        applicationId "app.phisap.pocket"
        minSdk 26
        targetSdk 34
        versionCode 29
        versionName "3.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

def nativePayloadApk = rootProject.file("phisap-pocket.apk")
def generatedAssets = layout.buildDirectory.dir("generated/phisap-assets")
def generatedJniLibs = layout.buildDirectory.dir("generated/phisap-jniLibs")
tasks.register("extractPocketNativeAssets") {
    inputs.file(nativePayloadApk)
    outputs.dir(generatedAssets)
    outputs.dir(generatedJniLibs)
    doLast {
        if (!nativePayloadApk.isFile()) {
            throw new GradleException("Build android/phisap-pocket.apk first")
        }
        def assetDir = generatedAssets.get().asFile
        def jniDir = generatedJniLibs.get().asFile
        assetDir.mkdirs()
        jniDir.mkdirs()
        def archive = new java.util.zip.ZipFile(nativePayloadApk)
        try {
            ["libphisap.so", "inside.sh", "phisap-tapd", "phisap-inject"].each { name ->
                def entry = archive.getEntry("assets/${name}")
                if (entry == null) {
                    throw new GradleException("Pocket APK has no assets/${name}")
                }
                def outputFile = new File(assetDir, name)
                outputFile.parentFile.mkdirs()
                archive.getInputStream(entry).withCloseable { input ->
                    outputFile.withOutputStream { output -> input.transferTo(output) }
                }
            }
            ["libphisap.so", "libphisap-tapd.so", "libphisap-inject.so"].each { name ->
                def entry = archive.getEntry("lib/arm64-v8a/${name}")
                if (entry == null) {
                    throw new GradleException("Pocket APK has no ARM64 lib/${name}")
                }
                def outputFile = new File(jniDir, "arm64-v8a/${name}")
                outputFile.parentFile.mkdirs()
                archive.getInputStream(entry).withCloseable { input ->
                    outputFile.withOutputStream { output -> input.transferTo(output) }
                }
            }
        } finally {
            archive.close()
        }
    }
}
tasks.named("preBuild").configure {
    dependsOn("extractPocketNativeAssets")
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
